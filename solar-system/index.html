function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#050e1b';ctx.fillRect(0,0,w,h);const neb=ctx.createRadialGradient(w*.45,h*.45,0,w*.45,h*.45,Math.max(w,h)*.65);neb.addColorStop(0,'#17364a70');neb.addColorStop(1,'#07122200');ctx.fillStyle=neb;ctx.fillRect(0,0,w,h);for(const [x,y,r]of stars){ctx.fillStyle=`rgba(177,207,233,${.15+r*.42})`;ctx.fillRect(x*w,y*h,r> .88?2:1,r>.88?2:1);}if(system==='Sun')belts();for(const b of list())if(!inner||b.elements.a<5||system!=='Sun')paintPath(b);
 const center=screen([0,0]);if(system==='Sun'){sun(ctx,...center,physicalRadius('Sun'));locator(...center,'#f4ce80');}else if(system!=='Pluto'){const size=physicalRadius(system);physicalSphere(byId[system],...center,size);locator(...center,byId[system].color);}hits=[];const placed=[];
 for(const b of list()){if(system==='Sun'&&inner&&b.elements.a>5)continue;const xy=screen(current(b));if(system==='Sun'&&!follow&&!inner&&b.elements.a<3.5&&b.elements.a*camera.s<35)continue;if(xy[0]<-70||xy[0]>w+70||xy[1]<-70||xy[1]>h+70)continue;const r=physicalRadius(b.id);physicalSphere(b,...xy,r);if(r<12)locator(...xy,b.color);hits.push({id:b.id,x:xy[0],y:xy[1],r:Math.max(20,r*1.7)});let ly=xy[1]+r+17,lx=xy[0];for(const [px,py]of placed)if(Math.abs(px-lx)<65&&Math.abs(py-ly)<18)ly+=19;placed.push([lx,ly]);ctx.font=`${selected===b.id?'600 ':''}13px system-ui`;ctx.textAlign='center';ctx.fillStyle='#e7f1f7';ctx.shadowColor='#02070c';ctx.shadowBlur=5;ctx.fillText(b.name,lx,ly);ctx.shadowBlur=0;ctx.textAlign='left';if(selected===b.id){ctx.strokeStyle='#a5e6d7';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(...xy,r+6+Math.sin(time*3)*1.5,0,TAU);ctx.stroke();}}
 if(system==='Sun'&&!follow&&!inner&&camera.s<35){ctx.fillStyle='#a9d9e8';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(wide?'内侧行星 · 点击展开':'内太阳系 · 点击展开',center[0],center[1]+39);ctx.textAlign='left';hits.push({id:wide?'planetary':'inner',x:center[0],y:center[1]+23,r:30});}grid();const title=system==='Sun'?(inner?'内太阳系 · 黄道面':wide?'太阳系 · 完整轨道全景':'太阳系 · 行星区'):`${byId[system].name} · ${system==='Pluto'?'质心与卫星':'卫星系统'}`;document.querySelector('#title').textContent=title;document.querySelector('#clock').textContent=mode==='view'?`观赏运行 ${time.toFixed(1)} 秒 · ${speed}×`:`${system==='Sun'?'公转':'卫星'}时间 +${(system==='Sun'?realDays:localDays).toFixed(1)} 天 · ${speed}×`;document.querySelector('#explain').textContent=mode==='view'?'观赏模式：分别压缩各轨道周期，让外侧天体也有明显运动。':`真实周期比例：${system==='Sun'?'每秒推进 90 天':'每秒推进 0.5 天'}，同一视图内使用同一时间。`;frames++;
}
function inspect(id){selected=id;document.querySelector('#surface').hidden=false;const b=byId[id];document.querySelector('#bodyName').textContent=b.name;pc.setTransform(3,0,0,3,0,0);pc.clearRect(0,0,160,150);sphere(pc,b,80,72,b.id==='Saturn'?37:53,time);const has=bodies.some(x=>x.parent===id);document.querySelector('#satellites').hidden=!has;document.querySelector('#satellites').textContent='查看 '+b.name+' 卫星系统 →';document.querySelector('#facts').innerHTML=`${b.kind==='planet'?'行星':b.kind==='dwarf'?'矮行星':'天然卫星'}<br>轨道半长轴：${b.parent==='Sun'?b.elements.a.toFixed(3)+' AU':Math.round(b.elements.a*AU).toLocaleString()+' km'}<br>轨道周期：${b.elements.periodDays.toFixed(2)} 天<br>平均半径：${radii[id].toLocaleString()} km<br>肖像独立放大；主图实体尺寸与距离同尺度。`;document.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));}
function choose(id){if(system!=='Sun'&&byId[id].parent==='Sun')system='Sun';inspect(id);follow=true;inner=false;target.s=system==='Sun'?Math.min(w,h)/(Math.max(1.5,byId[id].elements.a*.6)*2):Math.min(w,h)/(extent()*1.6);const xy=current(byId[id]);target.x=xy[0]+(w>700?100:0)/target.s;target.y=xy[1];document.querySelector('#inspector').classList.add('open');}
function chips(){const c=document.querySelector('#chips');c.innerHTML='';for(const b of list()){const button=document.createElement('button');button.dataset.id=b.id;button.innerHTML=`<i style="background:${b.color}"></i>${b.name}`;button.onclick=()=>{inspect(b.id);if(system==='Sun')choose(b.id);else{follow=false;target.x=0;target.y=0;}};c.append(button);}}
function enter(){if(!selected||!bodies.some(b=>b.parent===selected))return;system=selected;follow=false;inner=false;localDays=0;time=0;chips();fit();document.querySelector('#back').style.display='block';document.querySelector('#inspector').classList.toggle('open',w>700);}
function home(internal=false,full=false){system='Sun';inner=internal;wide=full;follow=false;selected=null;time=0;realDays=0;chips();fit();document.querySelector('#back').style.display='none';document.querySelector('#inspector').classList.remove('open');document.querySelector('#bodyName').textContent='选择一颗星球';pc.clearRect(0,0,portrait.width,portrait.height);document.querySelector('#facts').innerHTML='点击星球或底部名称，镜头会平滑靠近。<br>再打开卫星系统，观察卫星绕转。<br>实体尺寸与距离使用同一比例；发光点仅为定位标记。';document.querySelector('#satellites').hidden=true;document.querySelector('#surface').hidden=true;}
function zoom(f,x=w/2,y=h/2){follow=false;const s=Math.max(.2,Math.min(AU*.03,target.s*f)),world=[camera.x+(x-w/2)/camera.s,camera.y-(y-h/2)/camera.s];target={s,x:world[0]-(x-w/2)/s,y:world[1]+(y-h/2)/s};}
function resize(){document.documentElement.style.setProperty('--head',document.querySelector('header').offsetHeight+'px');const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);fit();camera={...target};}window.addEventListener('resize',resize);
document.querySelector('#play').onclick=()=>{playing=!playing;last=0;document.querySelector('#play').textContent=playing?'暂停 ⏸':'播放 ▶';};document.querySelector('#mode').onchange=e=>{mode=e.target.value;time=0;realDays=0;localDays=0;};document.querySelector('#speed').onchange=e=>speed=+e.target.value;document.querySelector('#inner').onclick=()=>home(true);document.querySelector('#planetary').onclick=()=>home(false);document.querySelector('#fit').onclick=()=>home(false,true);document.querySelector('#reset').onclick=()=>{time=realDays=localDays=0;fit();};document.querySelector('#back').onclick=()=>home();document.querySelector('#satellites').onclick=enter;document.querySelector('#plus').onclick=()=>zoom(1.7);document.querySelector('#minus').onclick=()=>zoom(1/1.7);document.querySelector('#toggleInfo').onclick=()=>document.querySelector('#inspector').classList.toggle('open');document.querySelector('#export').onclick=()=>canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='太阳系探索当前画面.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);});
canvas.onwheel=e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.x,e.clientY-r.y);};canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);drag={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y,moved:false};if(pointers.size===2){const v=[...pointers.values()];pinch=Math.hypot(v[1][0]-v[0][0],v[1][1]-v[0][1]);}};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){const v=[...pointers.values()],n=Math.hypot(v[1][0]-v[0][0],v[1][1]-v[0][1]),r=canvas.getBoundingClientRect();if(pinch)zoom(n/pinch,(v[0][0]+v[1][0])/2-r.x,(v[0][1]+v[1][1])/2-r.y);pinch=n;drag.moved=true;}else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5){drag.moved=true;follow=false;target.x=drag.cx-dx/camera.s;target.y=drag.cy+dy/camera.s;}}};canvas.onpointerup=e=>{pointers.delete(e.pointerId);if(drag&&!drag.moved&&!pinch){const r=canvas.getBoundingClientRect(),x=e.clientX-r.x,y=e.clientY-r.y;const b=[...hits].reverse().find(v=>Math.hypot(v.x-x,v.y-y)<v.r);if(b){if(b.id==='inner')home(true);else if(b.id==='planetary')home();else{inspect(b.id);if(system==='Sun')choose(b.id);}}}drag=null;pinch=0;};canvas.onpointercancel=()=>{drag=null;pinch=0;pointers.clear();};canvas.ondblclick=()=>fit();document.addEventListener('visibilitychange',()=>last=0);
function advance(dt){time+=dt*speed;realDays+=dt*speed*90;localDays+=dt*speed*.5;}function tick(ts){if(last&&ts-last<1000/30){requestAnimationFrame(tick);return;}const dt=last?Math.min((ts-last)/1000,.1):0;last=ts;if(playing&&!document.hidden)advance(dt);if(follow&&selected){const xy=current(byId[selected]);target.x=xy[0]+(w>700?100:0)/target.s;target.y=xy[1];}const alpha=1-Math.exp(-Math.max(.01,dt)*6);camera.s=Math.exp(Math.log(camera.s)+(Math.log(target.s)-Math.log(camera.s))*alpha);camera.x+=(target.x-camera.x)*alpha;camera.y+=(target.y-camera.y)*alpha;draw();requestAnimationFrame(tick);}

function physicalRing(c,x,y,r,start,end){const k=r/radii.Saturn;c.save();c.translate(x,y);c.rotate(.1836);c.scale(1,.88228);for(const [lo,hi,color] of [[66900,74491,'#686858a0'],[74491,91975,'#aaa58b99'],[91975,117570,'#c7c2a9c0'],[122050,136770,'#ddd5bdc0']]){c.strokeStyle=color;c.lineWidth=(hi-lo)*k;c.beginPath();c.arc(0,0,(lo+hi)/2*k,start,end);c.stroke();}c.restore();}
function locator(x,y,color){const radius=12+Math.sin(time*1.8)*.8;ctx.save();ctx.globalCompositeOperation='lighter';const glow=ctx.createRadialGradient(x,y,0,x,y,radius);glow.addColorStop(0,'#ffffffed');glow.addColorStop(.15,color+'dd');glow.addColorStop(.4,color+'66');glow.addColorStop(1,color+'00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,radius,0,TAU);ctx.fill();ctx.fillStyle='#f3fbff';ctx.beginPath();ctx.arc(x,y,2.4,0,TAU);ctx.fill();ctx.strokeStyle='rgba(235,250,255,'+(.35+.25*Math.sin(time*2.4+x*.017))+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.moveTo(x,y-7);ctx.lineTo(x,y+7);ctx.stroke();ctx.restore();}
function physicalSphere(b,x,y,r){if(r>=.75)sphere(ctx,b,x,y,r);else{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}}
function pauseForClose(){playing=false;last=0;document.querySelector('#play').textContent='播放 ▶';}
document.querySelector('#surface').onclick=()=>{if(!selected)return;pauseForClose();follow=true;const xy=current(byId[selected]);target.s=80*AU/radii[selected];target.x=xy[0]+(w>700?100:0)/target.s;target.y=xy[1];};
document.querySelector('#sunClose').onclick=()=>{home(true);pauseForClose();target={x:0,y:0,s:100*AU/radii.Sun};};
document.querySelector('#sizes').onclick=()=>{const c=document.querySelector('#sizeCanvas').getContext('2d');c.setTransform(2,0,0,2,0,0);c.fillStyle='#071724';c.fillRect(0,0,1000,560);sun(c,185,270,150);c.fillStyle='#f0d294';c.font='20px system-ui';c.fillText('太阳',160,455);c.font='14px system-ui';c.fillText('平均半径 695,700 km',95,482);const ratio=150/radii.Sun;solar.filter(b=>b.kind==='planet').forEach((b,i)=>{const x=420+(i%4)*145,y=180+Math.floor(i/4)*235,r=radii[b.id]*ratio;sphere(c,b,x,y,r,0,false);c.fillStyle='#e7eff6';c.font='16px system-ui';c.textAlign='center';c.fillText(b.name,x,y+45);c.font='12px system-ui';c.fillText(radii[b.id].toLocaleString()+' km',x,y+65);c.fillText('太阳 / 本体 = '+(radii.Sun/radii[b.id]).toFixed(1),x,y+84);c.textAlign='left';});document.querySelector('#comparison').showModal();};
document.querySelector('#closeSizes').onclick=()=>document.querySelector('#comparison').close();

window.__solarExplorer={state:()=>({playing,mode,speed,time,realDays,localDays,system,inner,selected,follow,camera:{...camera},target:{...target},w,h,dpr,frames,physicalScale:true,physicalRadii:Object.fromEntries(Object.keys(radii).map(id=>[id,physicalRadius(id)])),hits:JSON.parse(JSON.stringify(hits)),positions:list().map(b=>({id:b.id,xy:current(b)}))}),physicalRadius,radii,advance:dt=>{advance(dt);draw();},choose,enter,home,orbit,data:DATA};chips();resize();requestAnimationFrame(tick);
</script></html>
